name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Статический анализ (ESLint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint tests
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit-тесты
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Upload JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-unit
          path: playwright-report/results.json
          retention-days: 7

  api:
    name: API-тесты
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

      - name: Upload JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-api
          path: playwright-report/results.json
          retention-days: 7

  e2e:
    name: E2E-тесты
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-e2e
          path: playwright-report/results.json
          retention-days: 7

  coverage:
    name: Метрики и покрытие требований
    needs: [lint, unit, api, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Download reports
        uses: actions/download-artifact@v7
        with:
          path: reports
          pattern: results-*

      - name: Test metrics and coverage summary
        run: |
          set -o pipefail
          {
            echo '```'
            node scripts/test-metrics.mjs $(find reports -name 'results.json' | sort)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
