name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Проверки идут цепочкой fail-fast по уровням пирамиды: статический анализ →
# unit → api → e2e. Каждая следующая работа стартует через `needs` только после
# зелёной предыдущей, поэтому заведомо красный прогон не жжёт минуты на самом
# дорогом уровне — браузерном e2e на живом стенде.
jobs:
  lint:
    name: Статический анализ (ESLint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint tests
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Чистые функции без браузера — Chromium в этой работе не ставим.
  unit:
    name: Unit-тесты
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  # Мок-сервер поднимается прямо в тестовом процессе — браузер не нужен.
  api:
    name: API-тесты
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

  # Единственная работа с реальным браузером — только здесь нужны бинарники Chromium.
  e2e:
    name: E2E-тесты
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Включает CI-режим в playwright.config.ts: retry, один worker и reporter без открытия окна.
          CI: true

      - name: Upload Playwright report
        # Отчёт выкладываем и после успеха, и после падения; пропускаем только отменённый run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
